name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Test (unit)
        run: pnpm test

      # No DATABASE_URL is set, so the harness starts and tears down its own
      # real PostgreSQL server. Set DATABASE_URL here to use a service
      # container instead — the harness will reuse it.
      - name: Test (integration)
        run: pnpm test:integration

      - name: Build
        run: pnpm build
